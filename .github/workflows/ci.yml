name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vector-store
    env:
      SVS_STATECIVICS_REPO: ${{ github.workspace }}/statecivics
      PYTHONPATH: ${{ github.workspace }}/vector-store/packages/svs_common:${{ github.workspace }}/vector-store/apps/api:${{ github.workspace }}/vector-store/apps/worker:${{ github.workspace }}/vector-store/apps/model_gateway:${{ github.workspace }}/vector-store/apps/instance_agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: vector-store
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Derive the declared upstream pin
        id: upstream-pin
        run: echo "commit=$(python scripts/ci/upstream_proof.py --pin)" >> "$GITHUB_OUTPUT"
      - name: Require scoped upstream read access
        env:
          UPSTREAM_READ_TOKEN: ${{ secrets.STATECIVICS_READ_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_READ_TOKEN" ]; then
            echo '::error::STATECIVICS_READ_TOKEN is required: read-only Contents access to mfreeze77/state-civics-ai. Do not substitute a broad personal token.'
            exit 1
          fi
      - name: Check out the private upstream at its declared pin
        uses: actions/checkout@v4
        with:
          repository: mfreeze77/state-civics-ai
          ref: ${{ steps.upstream-pin.outputs.commit }}
          fetch-depth: 0
          path: statecivics
          token: ${{ secrets.STATECIVICS_READ_TOKEN }}
          persist-credentials: false
      - name: Preserve the fetched upstream main ancestry
        run: |
          git -C "$SVS_STATECIVICS_REPO" branch --no-track main refs/remotes/origin/main
          test "$(git -C "$SVS_STATECIVICS_REPO" rev-parse HEAD)" = '${{ steps.upstream-pin.outputs.commit }}'
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.txt pytest
      - name: Prove history and upstream SET/UNSET behavior
        run: python scripts/ci/upstream_proof.py
      - run: python -m compileall -f packages apps tests
      - name: Collect the reviewed workstation corpus boundary
        run: python scripts/ci/python_gate.py collect
      - name: Run CI tests and verify every deselection
        run: python scripts/ci/python_gate.py run
      - name: Preserve test and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-gate-evidence
          path: vector-store/ci-results/
          if-no-files-found: warn

  postgres-rls-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r apps/api/requirements.txt pytest psycopg[binary]
      - run: cp .env.example .env
      - run: docker compose up -d postgres
      - run: |
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U svs_owner -d svs; then exit 0; fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - run: |
          DATABASE_URL_MIGRATIONS=postgresql://svs_owner:svs_owner_dev_password@localhost:5432/svs \
          DATABASE_URL_SYNC=postgresql://svs_owner:svs_owner_dev_password@localhost:5432/svs \
          POSTGRES_APP_USER=svs_app \
          POSTGRES_APP_PASSWORD=svs_app_dev_password \
          POSTGRES_DB=svs \
          bash scripts/migrate.sh
      - run: |
          PYTHONPATH=packages/svs_common:apps/api:apps/worker:apps/model_gateway:apps/instance_agent \
          SVS_RUN_INTEGRATION=1 \
          DATABASE_URL_MIGRATIONS=postgresql://svs_owner:svs_owner_dev_password@localhost:5432/svs \
          DATABASE_URL=postgresql+psycopg://svs_app:svs_app_dev_password@localhost:5432/svs \
          SVS_TEST_APP_DSN=postgresql://svs_app:svs_app_dev_password@localhost:5432/svs \
          pytest -q tests/integration
      - if: always()
        run: docker compose logs postgres
      - if: always()
        run: docker compose down -v
