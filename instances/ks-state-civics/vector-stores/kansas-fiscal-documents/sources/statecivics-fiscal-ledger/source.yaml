apiVersion: svs/v1
kind: VectorStoreSourcePackage
metadata:
  instanceSlug: ks-state-civics
  vectorStoreSlug: kansas-fiscal-documents
  sourceSlug: statecivics-fiscal-ledger
  productionReady: false
vectorStore:
  id: vs_kansas_fiscal_documents_pending
  name: Kansas Fiscal Documents
  tenantId: ten_ks_state_civics
  businessInstanceId: biz_ks_state_civics
  knowledgeBaseId: kb_ks_civics
source:
  type: statecivics_custody_ledger_projection
  connector:
    kind: external_repo_custody_projection
    repository: operator-source://statecivics-ai
    entrypoint: scripts/operator/export_retrieval_manifest.py
    revision: 4a8cab323f73f360b4bfec2e361c3737f434c4bb
    contract: contracts/civic-impact/retrieval-export-record.schema.json
    # The contract dispatches on tag presence into two independently versioned
    # branches. A whole-file digest pinned both at once, so an entity-branch
    # edit invalidated the document pin; it was also computed by nothing, so it
    # went stale unnoticed. Each branch is now pinned over the $defs subtree
    # reachable from its own dispatch target, and ingestion recomputes it.
    contractPin:
      algorithm: sha256-canonical-json-subtree-v1
      # Three literal digests, all enforced. There is deliberately no
      # annotation-stripped "semantic" digest: JSON Schema property names share a
      # namespace with annotation keywords, so stripping keys named description or
      # title also strips the real properties legacy_document_record.properties.title
      # and entity_projection_record.properties.description -- which made a genuine
      # constraint change on the enforced branch report as "annotation-only drift".
      # Each digest carries the commit it was computed from; they move separately.
      documentBranchCommit: 314beafe4f7905f06a2edb7828b0ea8b2976266c
      documentBranchSha256: d3a7212a4873a2f375d451e74ab4d5f11a56ff50bbbeb5a162dae1f8640807e2
      entityBranchCommit: 314beafe4f7905f06a2edb7828b0ea8b2976266c
      entityBranchSha256: d5248a5452389c40a55c844f2e455343b2e24ce3dedff9a9ecac0752eeb28734
      # The top-level if/then/else routing predicate. A change to routing alone
      # redirects records between branches while both branch subtrees stay
      # byte-identical, so it is pinned and enforced on its own.
      dispatchCommit: 314beafe4f7905f06a2edb7828b0ea8b2976266c
      dispatchSha256: 03dc178429d04275f7b49a6d4ab9e05ee56bc970a31de78268942eb3de3b7940
      supersededEntityBranch:
        # Prose-only drift: A rewrote two entity-branch descriptions, which moved
        # this digest and left the document branch untouched.
        commit: e94a894e6f66fdd7eb6b798e35b3ebe7a2ae266a
        sha256: da242fd879b3c124449b6c1ddead558db64d8f0427ade638bf596c8fd1d9f17e
      enforcedBy: packages/svs_common/svs_common/statecivics_contract_pin.py
      # EVERY runner that reads a desired-state manifest through the document
      # consumer enforces. Listing some while another ran unpinned is the defect
      # this pin exists to remove, and it recurred because this list was
      # hand-maintained. It is no longer trusted as written: it is checked for
      # exact set equality against the call sites discovered by walking the
      # tracked source tree in
      # tests/test_statecivics_contract_pin.py::test_every_load_manifest_caller_enforces_the_pin.
      # A fourth caller, or a stale entry here, fails that test with no human
      # updating a list.
      enforcedAt:
        - scripts/release/kansas-fiscal-document-ingest.py --contract-schema
        - scripts/release/kansas-fiscal-marker-handoff.py --contract-schema
        - scripts/release/kansas-statute-rollout.py --contract-schema
      enforcedPins:
        document-consumer: [document, dispatch]
        entity-consumer: [entity, dispatch]
      # Superseded whole-file digest, kept as a (commit, digest) pair so it
      # stays true: git show b3f5c09170c66453097bcd4fb44c6eb2b9031f39:<contract>
      supersededWholeFile:
        commit: b3f5c09170c66453097bcd4fb44c6eb2b9031f39
        sha256: 78a3de138cdb534831df034bc66f6a6a2bf7ec3f5d6d573efedf2b50d7a7f32b
  storage:
    rawCorpusUri: civic-custody://statecivics/
    manifestUri: statecivics-export://ks-state-civics/kansas-fiscal-documents.jsonl
    backupUri: backup://statecivics/custody/kansas-fiscal-documents/
  seed:
    layout: instance_source_seed_v1
    folderUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-fiscal-ledger/seed/
    rawSubdir: raw/
    extractedSubdir: extracted/
    manifestsSubdir: manifests/
    extractedArtifactsUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-fiscal-ledger/seed/extracted/
    citationUrlMapUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-fiscal-ledger/seed/citation-url-map.jsonl
  citation:
    sourceUriPolicy: official_pdf_url
    sourceUrlField: citation_url
    storeExtractedArtifacts: true
  manifest:
    format: jsonl
    stableIdentityFields:
      - logical_document_id
    checksumField: record_digest_sha256
    savedPathField: custody_uri
    lockFile: source.lock.json
artifactGeneration:
  mode: api_routed_marker_serverless_v1
  runner: POST /api/v1/documents/upload
  boundary: PDFs use the configured RunPod Marker serverless endpoint through the ExAIS API; no local Marker install and no direct storage writes.
  profile:
    name: fiscal_tables_page_aware_v1
    outputFormat: markdown
    paginateOutput: true
    htmlTablesInMarkdown: true
    disableImageExtraction: false
  routing:
    application/pdf: marker_required
    text/markdown: direct_structured_ingest
    text/plain: direct_structured_ingest
  markerOutput:
    mode: pdf_markdown_external_v1
    retained: true
    provenanceFields:
      - pdf_parser
      - marker_job_id
      - marker_pages
      - marker_metadata
      - source_pdf_id
      - source_pdf_object_key
      - created_at
      - completed_at
  extractionHandoff:
    mode: persisted_marker_markdown_export_v1
    boundary: Fetches the Markdown and metadata already persisted by ExAIS; makes zero Marker requests and returns candidate evidence to StateCivics without resolving fiscal identities.
    contract:
      repository: operator-source://statecivics-ai
      revision: 14e54878785387991aaf332eb8b416133934162e
      path: contracts/civic-impact/marker-extraction-record.schema.json
      sha256: a0ff93a4cca17d78f243007861a14f5c6249fb865180c255ca35dd995f617839
    runner: scripts/release/kansas-fiscal-marker-handoff.py
    command:
      - python
      - scripts/release/kansas-fiscal-marker-handoff.py
      - --manifest
      - ${STATECIVICS_FISCAL_MANIFEST}
      - --contract-schema
      - ${STATECIVICS_RETRIEVAL_EXPORT_SCHEMA}
      - --state
      - .release/cells/ks-state-civics/kansas-fiscal-documents/state.json
      - --output-dir
      - .release/cells/ks-state-civics/kansas-fiscal-documents/marker-handoff
      - --code-commit
      - ${EXAIS_CODE_COMMIT}
      - --api-transport
      - docker-network
    outputContract:
      - marker-handoff/manifest.jsonl
      - marker-handoff/extracted/*.md
      - marker-handoff/handoff-proof.json
qualityGate:
  requiredBeforeIngestion: true
  vectorizationAllowed: true
  runner: scripts/release/marker-fiscal-quality-proof.py
  boundary: One hash-pinned representative PDF is sent to Marker once; table, row, anchor, and digest checks inspect that same response without another extraction.
  profileSha256: c7d024d803c7e0feb685569a1eac786a622ade2445fb740a42e9d4b4968b53f0
  command:
    - python
    - scripts/release/marker-fiscal-quality-proof.py
    - --pdf
    - ${KANSAS_FISCAL_QUALITY_PDF}
    - --profile
    - instances/ks-state-civics/vector-stores/kansas-fiscal-documents/quality/fy2025-director-presentation.json
    - --profile-sha256
    - c7d024d803c7e0feb685569a1eac786a622ade2445fb740a42e9d4b4968b53f0
    - --output
    - .release/cells/ks-state-civics/kansas-fiscal-documents/marker-quality-proof.json
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/kansas-fiscal-documents/marker-quality-proof.json
ingestion:
  mode: api
  runner: scripts/release/kansas-fiscal-document-ingest.py
  gatedBy: marker-fiscal-quality-proof.passed
  command:
    - python
    - scripts/release/kansas-fiscal-document-ingest.py
    - --cell
    - ks-state-civics
    - --manifest
    - ${STATECIVICS_FISCAL_MANIFEST}
    - --contract-schema
    - ${STATECIVICS_RETRIEVAL_EXPORT_SCHEMA}
    - --custody-root
    - ${STATECIVICS_CUSTODY_ROOT}
    - --state
    - .release/cells/ks-state-civics/kansas-fiscal-documents/state.json
    - --proof
    - .release/cells/ks-state-civics/kansas-fiscal-documents/ingest-proof.json
    - --vector-store-id
    - ${KANSAS_FISCAL_VECTOR_STORE_ID}
    - --vector-store-name
    - Kansas Fiscal Documents
    - --knowledge-base-id
    - kb_ks_civics
    - --api-transport
    - docker-network
  idempotency: vector_store_logical_document_action_record_digest_sha256
updatePolicy:
  diffMode: desired_state_logical_identity_and_record_digest
  removedRecords: explicit_api_delete_by_prior_vector_store_file_id
  dryRunRequired: true
  removalFirst: true
graph:
  enabled: false
  handlerId: kansas_fiscal_law_money_graph_v1
  profileId: ks-state-civics.kansas-fiscal-documents.v1
  profileExample: instances/ks-state-civics/vector-stores/kansas-fiscal-documents/graph/profile.example.yaml
  runner: scripts/release/kansas-fiscal-graphrag.py
  searchLens: fiscal_relationships
  boundary: State Civics fiscal store only; requires reviewed publisher evidence and an explicitly served graph run. No automatic graph expansion for semantic search.
eval:
  command:
    - python
    - scripts/release/kansas-fiscal-recall-eval.py
    - --cell
    - ks-state-civics
    - --vector-store-id
    - ${KANSAS_FISCAL_VECTOR_STORE_ID}
    - --api-transport
    - docker-network
    - --output
    - .release/cells/ks-state-civics/kansas-fiscal-documents/recall-proof.json
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/kansas-fiscal-documents/ingest-proof.json
    - .release/cells/ks-state-civics/kansas-fiscal-documents/recall-proof.json
    - .release/cells/ks-state-civics/kansas-fiscal-documents/marker-handoff/handoff-proof.json
