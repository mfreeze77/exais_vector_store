[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "topeka-code-scraper"
version = "0.1.4"
description = "Polite scraper for the Topeka Municipal Code with clean JSONL and GraphRAG-ready graph exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAI" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "pydantic>=2.7.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
browser = [
  "playwright==1.55.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
]

[project.scripts]
topeka-code-scraper = "topeka_code_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/topeka_code_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
