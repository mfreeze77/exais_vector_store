apiVersion: svs/v1
kind: VectorStoreSourcePackage
metadata:
  instanceSlug: ks-state-civics
  vectorStoreSlug: topeka-municipal-code
  sourceSlug: topeka-codified-code
  productionReady: false
vectorStore:
  id: vs_d4185d1004604f08a55299fa
  name: City of Topeka Municipal Code
  tenantId: ten_ks_state_civics
  businessInstanceId: biz_ks_state_civics
  knowledgeBaseId: kb_ks_civics
source:
  type: topeka_codified_municipal_code
  connector:
    kind: vendored_python_package
    repository: local-instance-source://instances/ks-state-civics/vector-stores/topeka-municipal-code/sources/topeka-codified-code/connector/topeka-code-scraper
    entrypoint: instances/ks-state-civics/vector-stores/topeka-municipal-code/sources/topeka-codified-code/connector/topeka-code-scraper/src/topeka_code_scraper/cli.py
    revision: topeka-code-scraper-v0.1.4-exais-capture-import
    acquisitionSpec: docs/TOPEKA_MUNICIPAL_CODE_SEEDING_SPEC.md
    upstreamZip: seed/raw/vendor/topeka-code-scraper-v0.1.1.zip
    upstreamZipSha256: bf143b147b70259a8b31adf3340553e633bfe54006617f7f6d5080830d2a2e51
    urlManifest: seed/raw/topeka_municipal_code_urls.csv
    urlManifestSha256: 0f7a081250615a882b105c5f9d558f0eb2e224c603695fa2702b0942d0d4800b
    urlManifestRows: 3204
    fetchLevels:
      - Section
      - Subsection
    fetchMode: playwright_manifest_only_isolated_context
  storage:
    rawCorpusUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/raw/
    manifestUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/manifests/sections.jsonl
    backupUri: backup://exai-vector-store-ks-state-civics/sources/topeka-codified-code/pending/
  seed:
    layout: instance_source_seed_v1
    folderUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/
    rawSubdir: raw/
    extractedSubdir: extracted/
    manifestsSubdir: manifests/
    workbenchSubdir: workbench/
    extractedArtifactsUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/extracted/
    workbenchProjectionUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/workbench/
    citationUrlMapUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/topeka-codified-code/seed/citation-url-map.jsonl
  citation:
    sourceUriPolicy: canonical_source_url
    sourceUrlField: source_url
    storeExtractedArtifacts: true
  manifest:
    format: jsonl
    stableIdentityFields:
      - id
    checksumField: content_hash
    savedPathField: source_url
    lockFile: source.lock.json
artifactGeneration:
  mode: json_only
  runner: instances/ks-state-civics/vector-stores/topeka-municipal-code/sources/topeka-codified-code/connector/topeka-code-scraper/src/topeka_code_scraper/cli.py
  command:
    - python
    - -m
    - topeka_code_scraper
    - --fetcher
    - playwright
    - --isolate-playwright-context
    - --url-list
    - seed/raw/topeka_municipal_code_urls.csv
    - --url-list-levels
    - Section,Subsection
    - --manifest-only
    - --archive-raw
    - --archive-network
    - --output
    - ${TOPEKA_CODE_OUTPUT}
  outputContract:
    - sections.jsonl
    - definitions.jsonl
    - nodes.jsonl
    - edges.jsonl
    - citation-url-map.jsonl
    - url-manifest.jsonl
    - expected-fetch-urls.jsonl
    - manifest.json
    - crawl_report.json
  authorizedCaptureImport:
    mode: operator_owned_html_capture_manifest
    runner: instances/ks-state-civics/vector-stores/topeka-municipal-code/sources/topeka-codified-code/connector/topeka-code-scraper/src/topeka_code_scraper/cli.py
    boundary: acquisition route, cookies, credentials, proxy logic, captcha solving, stealth plugins, and challenge-circumvention code stay outside this repository
    command:
      - python
      - -m
      - topeka_code_scraper
      - --capture-manifest
      - ${TOPEKA_CAPTURE_MANIFEST}
      - --capture-root
      - ${TOPEKA_CAPTURE_ROOT}
      - --url-list
      - seed/raw/topeka_municipal_code_urls.csv
      - --url-list-levels
      - Section,Subsection
      - --manifest-only
      - --archive-raw
      - --archive-network
      - --output
      - ${TOPEKA_CODE_OUTPUT}
    captureRowContract:
      required:
        - url
        - html_or_html_path
      optional:
        - status_code
        - headers
        - retrieved_at
        - network_events
        - source
  batchConsolidation:
    mode: artifact_only_batch_merge
    runner: scripts/release/topeka-code-combine-batches.py
    boundary: reads completed batch JSON/raw/network artifacts and writes one combined source-output folder; no ingestion, vectorization, Qdrant, Postgres, MinIO, OpenSearch, or graph writes
    command:
      - python
      - scripts/release/topeka-code-combine-batches.py
      - --batch-root
      - ${TOPEKA_CODE_BATCH_ROOT}
      - --output-dir
      - ${TOPEKA_CODE_OUTPUT}
    gatedBy:
      - every-batch-quality-report.passed
    outputContract:
      - sections.jsonl
      - definitions.jsonl
      - nodes.jsonl
      - edges.jsonl
      - citation-url-map.jsonl
      - url-manifest.jsonl
      - expected-fetch-urls.jsonl
      - manifest.json
      - crawl_report.json
      - raw/
      - network/
workbenchProjection:
  mode: topeka_municipal_code_v1
  status: required_before_workbench_import
  boundary: projection-only; reads saved JSON/JSONL scrape artifacts and writes workbench JSON; no ingestion, vectorization, Qdrant, Postgres, MinIO, OpenSearch, or graph writes
  runner: scripts/release/topeka-code-workbench-project.py
  gatedBy:
    - topeka-code-artifact-quality.passed
    - saved-raw-html-archive-present
  command:
    - python
    - scripts/release/topeka-code-workbench-project.py
    - --source-output
    - ${TOPEKA_CODE_OUTPUT}
    - --output-dir
    - ${TOPEKA_CODE_OUTPUT}/workbench
  outputContract:
    - workbench/canonical-document.json
    - workbench/components.jsonl
    - workbench/component-projection.jsonl
    - workbench/component-relations.jsonl
    - workbench/slices.jsonl
    - workbench/workbench-import-manifest.json
  stableIdentity:
    sourceComponentKey: preserved Topeka graph/source identity such as ks-topeka:tmc:1.10.020 or ks-topeka:tmc:1.10.020:marker:a
    workbenchComponentId: deterministic UUIDv5 derived from sourceComponentKey
  sliceLevels:
    - title
    - chapter
    - appendix
    - article
qualityGate:
  requiredBeforeIngestion: true
  vectorizationAllowed: true
  runner: scripts/release/topeka-code-artifact-quality.py
  command:
    - python
    - scripts/release/topeka-code-artifact-quality.py
    - --source-output
    - ${TOPEKA_CODE_OUTPUT}
    - --url-list
    - instances/ks-state-civics/vector-stores/topeka-municipal-code/sources/topeka-codified-code/seed/raw/topeka_municipal_code_urls.csv
    - --output
    - ${TOPEKA_CODE_OUTPUT}/quality-report.json
    - --worklist-dir
    - ${TOPEKA_CODE_OUTPUT}/worklists
ingestion:
  mode: api
  runner: scripts/release/topeka-code-ingest.py
  gatedBy: topeka-code-artifact-quality.passed
  command:
    - python
    - scripts/release/topeka-code-ingest.py
    - --cell
    - ks-state-civics
    - --source-output
    - ${TOPEKA_CODE_OUTPUT}
    - --vector-store-name
    - City of Topeka Municipal Code
    - --vector-store-id
    - vs_d4185d1004604f08a55299fa
    - --knowledge-base-id
    - kb_ks_civics
    - --api-transport
    - docker-network
  idempotency: vector_store_source_identity_sha256
updatePolicy:
  diffMode: stable_identity_and_checksum
  removedRecords: soft_delete_or_expire_after_operator_approval
  dryRunRequired: true
graph:
  enabled: true
  extractCommand:
    - python
    - scripts/release/topeka-code-graphrag-extract.py
    - --source-output
    - ${TOPEKA_CODE_OUTPUT}
    - --ordinance-manifest
    - ${TOPEKA_ORDINANCE_MANIFEST}
    - --output-dir
    - .release/cells/ks-state-civics/graphrag/topeka-code
  loadCommand:
    - python
    - scripts/release/topeka-code-graphrag-load.py
    - --graph-artifact
    - .release/cells/ks-state-civics/graphrag/topeka-code
    - --vector-store-id
    - vs_d4185d1004604f08a55299fa
    - --api-transport
    - docker-network
    - --output
    - .release/cells/ks-state-civics/graphrag/topeka-code/load-proof.json
  lastProof:
    observedAt: '2026-08-28'
    status: loaded_and_search_verified_local
    graphApiRoute: /v1/vector_stores/vs_d4185d1004604f08a55299fa/graph
