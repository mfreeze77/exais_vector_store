    publicRoutePending: https://topks.statecivics.ai/local
  evalCommand:
    - python
    - scripts/release/topeka-code-graphrag-eval.py
    - --cell
    - ks-state-civics
    - --vector-store-id
    - vs_d4185d1004604f08a55299fa
    - --graph-artifact
    - .release/cells/ks-state-civics/graphrag/topeka-code
    - --output
    - .release/cells/ks-state-civics/graphrag/topeka-code/eval-proof.json
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/graphrag/topeka-code/graph-summary.json
    - .release/cells/ks-state-civics/graphrag/topeka-code/load-proof.json
    - .release/cells/ks-state-civics/graphrag/topeka-code/eval-proof.json
eval:
  command:
    - python
    - scripts/release/topeka-code-recall-eval.py
    - --cell
    - ks-state-civics
    - --vector-store-id
    - vs_d4185d1004604f08a55299fa
    - --api-transport
    - docker-network
    - --output
    - .release/cells/ks-state-civics/topeka-code-recall-eval.json
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/topeka-code-recall-eval.json

