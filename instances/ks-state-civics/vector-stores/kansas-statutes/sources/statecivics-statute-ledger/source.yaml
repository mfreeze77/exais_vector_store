apiVersion: svs/v1
kind: VectorStoreSourcePackage
metadata:
  instanceSlug: ks-state-civics
  vectorStoreSlug: kansas-statutes
  sourceSlug: statecivics-statute-ledger
  productionReady: false
vectorStore:
  id: vs_kansas_statutes_pending
  name: Kansas Statutes
  tenantId: ten_ks_state_civics
  businessInstanceId: biz_ks_state_civics
  knowledgeBaseId: kb_ks_civics
source:
  type: statecivics_custody_ledger_projection
  connector:
    kind: external_repo_custody_projection
    repository: operator-source://statecivics-ai
    entrypoint: scripts/operator/export_retrieval_manifest.py
    revision: 3f975e799851fa09d5ec91d22e63d5b1e96f9ae8
    contract: contracts/civic-impact/retrieval-export-record.schema.json
    contractSha256: 78a3de138cdb534831df034bc66f6a6a2bf7ec3f5d6d573efedf2b50d7a7f32b
  storage:
    rawCorpusUri: civic-custody://statecivics/
    manifestUri: statecivics-export://ks-state-civics/kansas-statutes.jsonl
    backupUri: backup://statecivics/custody/kansas-statutes/
  seed:
    layout: instance_source_seed_v1
    folderUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-statute-ledger/seed/
    rawSubdir: raw/
    extractedSubdir: extracted/
    manifestsSubdir: manifests/
    extractedArtifactsUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-statute-ledger/seed/extracted/
    citationUrlMapUri: object-store://exai-vector-store-ks-state-civics/instances/ks-state-civics/sources/statecivics-statute-ledger/seed/citation-url-map.jsonl
  citation:
    sourceUriPolicy: canonical_source_url
    sourceUrlField: citation_url
    storeExtractedArtifacts: true
  manifest:
    format: jsonl
    stableIdentityFields:
      - logical_document_id
    checksumField: record_digest_sha256
    savedPathField: custody_uri
    lockFile: source.lock.json
artifactGeneration:
  mode: retained_statute_markdown_v1
  boundary: Retain exact upstream Markdown; no PDF conversion, local rescrape, source mutation or invented pages.
  profile:
    name: statecivics_statute_markdown_v1
    requestAttribute: source_text_chunking_profile
    sourceCollection: statecivics-kansas-statutes
    outputFormat: markdown
  provenance:
    renderedHashMeaning: exact_retained_utf8_markdown
    responseHashMeaning: decoded_response_text_reencoded_utf8
    rawHtmlRetainedInLocalHarvest: false
qualityGate:
  requiredBeforeIngestion: true
  runner: scripts/release/kansas-statute-preflight.py
  boundary: Local harvest preparation only; custody and publication eligibility must come from the existing StateCivics retrieval export.
  command:
    - python
    - scripts/release/kansas-statute-preflight.py
    - --manifest
    - ${STATECIVICS_STATUTE_HARVEST_MANIFEST}
    - --expected-manifest-sha256
    - ${STATECIVICS_STATUTE_HARVEST_SHA256}
    - --corpus-root
    - ${STATECIVICS_STATUTE_CORPUS_ROOT}
    - --proof
    - .release/cells/ks-state-civics/kansas-statutes/preflight-proof.json
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/kansas-statutes/preflight-proof.json
ingestion:
  mode: api
  runner: scripts/release/kansas-fiscal-document-ingest.py
  sourceFamily: kansas-statutes
  embeddingProfile: voyage_4_docs_1024
  command:
    - python
    - scripts/release/kansas-fiscal-document-ingest.py
    - --source-family
    - kansas-statutes
    - --cell
    - ks-state-civics
    - --vector-store-slug
    - kansas-statutes
    - --vector-store-name
    - Kansas Statutes
    - --vector-store-id
    - ${KANSAS_STATUTES_VECTOR_STORE_ID}
    - --knowledge-base-id
    - kb_ks_civics
    - --manifest
    - ${STATECIVICS_STATUTE_RETRIEVAL_MANIFEST}
    - --custody-root
    - ${STATECIVICS_CUSTODY_ROOT}
    - --harvest-manifest
    - ${STATECIVICS_STATUTE_HARVEST_MANIFEST}
    - --harvest-manifest-sha256
    - ${STATECIVICS_STATUTE_HARVEST_SHA256}
    - --harvest-root
    - ${STATECIVICS_STATUTE_CORPUS_ROOT}
    - --state
    - .release/cells/ks-state-civics/kansas-statutes/state.json
    - --proof
    - .release/cells/ks-state-civics/kansas-statutes/ingest-proof.json
    - --api-transport
    - docker-network
  idempotency: scoped_source_identity_record_digest_profile_and_evidence
updatePolicy:
  diffMode: desired_state_logical_identity_record_digest_and_source_profile
  removedRecords: explicit_api_delete_by_prior_vector_store_file_id
  dryRunRequired: true
  removalFirst: true
graph:
  enabled: false
  boundary: History references remain unresolved source metadata; this package creates no canonical provisions or resolved statute-to-bill edges.
eval:
  command:
    - python
    - -m
    - pytest
    - -q
    - -rs
    - tests/test_statecivics_statutes.py
    - tests/test_kansas_statute_ingest.py
  expectedProofArtifacts:
    - .release/cells/ks-state-civics/kansas-statutes/preflight-proof.json
    - .release/cells/ks-state-civics/kansas-statutes/ingest-proof.json
  boundary: Offline preparation/parser/API-path proof; deployed retrieval recall and live source readiness remain pending.
