      # The same subtrees with annotation-only keywords removed, so a reworded
      # description can be told apart from a constraint change.
      documentBranchSemanticSha256: e75f616af11b97b28e59cb059cdaa55e1763f52f5b0353e6e8d7fa8cfaacbf45
      entityBranchSemanticSha256: 3ad8f594bae3426944725c2946325c23f32bd8d4a81d201913b080c37ce29bae
      supersededEntityBranch:
        # Prose-only drift: A rewrote two entity-branch descriptions, which moved
        # this digest and left the semantic digest and both document digests alone.
        commit: e94a894e6f66fdd7eb6b798e35b3ebe7a2ae266a
        sha256: da242fd879b3c124449b6c1ddead558db64d8f0427ade638bf596c8fd1d9f17e
