# Docker-first local/customer cell compose file.
# App services use manifest-derived, digest-pinned images. Infra services use
# public pinned upstream images and named volumes so a cell can be destroyed and
# recreated cleanly without source-tree data directories.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svs_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svs_owner_dev_password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-svs_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-svs_app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-svs}
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svs_owner} -d ${POSTGRES_DB:-svs}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_QDRANT_HTTP_PORT:-16333}:6333"
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-svs_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-svs_minio_password}
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_MINIO_PORT:-19000}:9000"
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-gateway:
    image: ${SVS_IMAGE_MODEL_GATEWAY:?SVS_IMAGE_MODEL_GATEWAY is required}
    env_file:
      - ${SVS_CELL_ENV_FILE:?SVS_CELL_ENV_FILE is required}
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_MODEL_GATEWAY_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    image: ${SVS_IMAGE_API:?SVS_IMAGE_API is required}
    env_file:
      - ${SVS_CELL_ENV_FILE:?SVS_CELL_ENV_FILE is required}
    environment:
      ANTHROPIC_API_KEY: ""
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    volumes:
      - object-store:/data/object-store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: ${SVS_IMAGE_WORKER:?SVS_IMAGE_WORKER is required}
    env_file:
      - ${SVS_CELL_ENV_FILE:?SVS_CELL_ENV_FILE is required}
    environment:
      ANTHROPIC_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    volumes:
      - object-store:/data/object-store
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import svs_worker.main; print('worker-ready')\""]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  admin-ui:
    image: ${SVS_IMAGE_ADMIN_UI:?SVS_IMAGE_ADMIN_UI is required}
    environment:
      VITE_API_BASE: ${SVS_PUBLIC_API_BASE:-http://localhost:18080}
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_ADMIN_UI_PORT:-13080}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  instance-agent:
    image: ${SVS_IMAGE_INSTANCE_AGENT:?SVS_IMAGE_INSTANCE_AGENT is required}
    env_file:
      - ${SVS_CELL_ENV_FILE:?SVS_CELL_ENV_FILE is required}
    environment:
      ANTHROPIC_API_KEY: ""
      SVS_AGENT_WORKDIR: /workspace
      SVS_INSTANCE_PIN_ROOT: /workspace/.release/instances
    profiles: ["agent"]
    ports:
      - "${SVS_BIND_IP:-0.0.0.0}:${SVS_INSTANCE_AGENT_PORT:-18090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SVS_AGENT_INSTANCE_ROOT:-../../instances}:/workspace/instances:ro
      - ${SVS_AGENT_RELEASE_CELL_ROOT:-../../.release/cells}:/workspace/.release/cells:ro
      - ${SVS_AGENT_PIN_ROOT:-../../.release/instances}:/workspace/.release/instances
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  object-store:
