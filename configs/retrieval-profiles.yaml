profiles:
  hybrid_rrf_secure_v2:
    dense_top_k: 80
    sparse_top_k: 80
    fused_top_k: 40
    context_top_k: 12
    fusion: reciprocal_rank_fusion
    rrf_k: 60
    require_pre_filter: true
    require_post_acl_check: true
    expand_neighbors: true
    neighbor_window: 1
    require_citations: true
    output_guard: pii_secret_citation_guard_v1

  hybrid_contextual_pdf_v1:
    dense_top_k: 120
    sparse_top_k: 120
    fused_top_k: 60
    context_top_k: 15
    fusion: reciprocal_rank_fusion
    rrf_k: 60
    expand_parent_sections: true
    expand_neighbors: true
    neighbor_window: 2
    require_page_citations: true
    require_post_acl_check: true

  hybrid_code_symbol_rrf_v2:
    dense_top_k: 60
    sparse_top_k: 120
    fused_top_k: 40
    context_top_k: 10
    fusion: weighted_rrf
    sparse_weight: 0.65
    dense_weight: 0.35
    exact_symbol_boost: 2.0
    require_post_acl_check: true

  structured_hybrid_filter_first_v1:
    dense_top_k: 50
    sparse_top_k: 100
    fused_top_k: 30
    context_top_k: 10
    require_metadata_filters: true
    require_post_acl_check: true

  sparse_first_then_semantic_v1:
    sparse_top_k: 120
    dense_top_k: 30
    fused_top_k: 30
    sparse_weight: 0.8
    dense_weight: 0.2
    require_post_acl_check: true
