    dimensions: 1024
    privacy: private_gpu

  bge_m3_infinity_local:
    provider: infinity
    kind: embedding
    model: BAAI/bge-m3
    dimensions: 1024
    privacy: private_gpu

  qwen3_embedding_local_4b:
    provider: runpod_serverless_or_local
    kind: embedding
    model: Qwen/Qwen3-Embedding-4B
    dimensions: 2560
    privacy: private_gpu

  hash_mock_1536:
    provider: hash_mock
    kind: embedding
    model: deterministic-dev-hash
    dimensions: 1536
    privacy: local_dev_only
    cost:
      currency: USD
      unit: 1m_input_tokens
      input_per_1m_tokens_usd: 0.0
      source: local_dev

chat_models:
  private_qwen3_32b_expert:
    provider: openai_compatible_private
    kind: chat
    model: Qwen/Qwen3-32B
    privacy: private_gpu
    max_security_level: 5

  openai_gpt_4_1_mini_expert:
    provider: openai
    kind: chat
    model: gpt-4.1-mini
    privacy: external_api
    max_security_level: 3

  fixture_expert_chat_v1:
    provider: fixture
    kind: chat
    model: deterministic-expert-fixture-v1
    privacy: local_test_only
    max_security_level: 5
    local_only: true

chat_policies:
  default_expert_chat_v1:
    preferred_model_profile_id: private_qwen3_32b_expert
    fallback_model_profile_ids: [openai_gpt_4_1_mini_expert]
    allow_fallback: true

  fixture_expert_chat_v1:
    preferred_model_profile_id: fixture_expert_chat_v1
    fallback_model_profile_ids: []
    allow_fallback: false

rerankers:
  optional_voyage_or_qwen_reranker_v1:
    candidates: [voyage_rerank_lite, qwen3_reranker_local, infinity_reranker_local, disabled]
  qwen3_reranker_local:
    provider: runpod_serverless_or_local
    kind: reranker
    model: Qwen/Qwen3-Reranker-4B
    privacy: private_gpu
    status: candidate_until_live_health_probe
  infinity_reranker_local:
    provider: infinity
    kind: reranker
    model: BAAI/bge-reranker-v2-m3
    privacy: private_gpu
    status: candidate_until_live_health_probe
  disabled_by_default:
    provider: disabled

policies:
  deny_external_above_security_level: 3
  require_private_provider_above_security_level: 4
  default_embedding_profile: openai_text_embedding_3_small_1536
  fallback_private_embedding_profile: bge_m3_local
  fallback_dev_embedding_profile: hash_mock_1536
