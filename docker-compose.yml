services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svs_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svs_owner_dev_password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-svs_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-svs_app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-svs}
    ports: ["5432:5432"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svs_owner} -d ${POSTGRES_DB:-svs}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["./data/redis:/data"]

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200", "9600:9600"]
    volumes: ["./data/opensearch:/usr/share/opensearch/data"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-svs_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-svs_minio_password}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./data/minio:/data"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on: [postgres, redis, qdrant, opensearch, minio, model-gateway]
    ports: ["8080:8080"]
    volumes:
      - ./configs:/app/configs:ro
      - ./instances:/app/instances:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on: [postgres, redis, qdrant, opensearch, minio, model-gateway]
    volumes:
      - ./configs:/app/configs:ro
      - ./instances:/app/instances:ro

  model-gateway:
    build:
      context: .
      dockerfile: apps/model_gateway/Dockerfile
    env_file: .env
    ports: ["8081:8081"]
    volumes:
      - ./configs:/app/configs:ro


  admin-ui:
    build:
      context: .
      dockerfile: apps/admin_ui/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8080
    depends_on: [api]
    ports: ["3000:3000"]

  instance-agent:
    build:
      context: .
      dockerfile: apps/instance_agent/Dockerfile
    env_file: .env
    profiles: ["agent"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    ports: ["8090:8090"]

  caddy:
    image: caddy:2
    profiles: ["edge"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [api]
