global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cell: local-cell

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: exais-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080
        labels:
          service: svs-api

  - job_name: exais-model-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - model-gateway:8081
        labels:
          service: svs-model-gateway
